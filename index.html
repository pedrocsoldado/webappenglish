<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14172e">
<title>English Quest</title>
<style>
:root{--bg:#14172e;--card:#1f2447;--card2:#2a3060;--line:#3a4180;--ink:#fff;--mut:#9aa3d6;--g:#58cc02;--gd:#46a302;--r:#ff5a5a;--rd:#d63c3c;--y:#ffc800;--b:#1cb0f6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -10%,#2b3377 0%,#14172e 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px)}
.row{display:flex;align-items:center;gap:10px}
.chip{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
/* HOME */
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.av{font-size:40px;background:var(--card);border-radius:18px;width:62px;height:62px;display:grid;place-items:center}
.hero .t{flex:1;min-width:0}
.hero h1{font-size:20px;margin:0}
.hero small{color:var(--mut)}
.xpbar{height:10px;background:var(--card);border-radius:9px;overflow:hidden;margin-top:6px}
.xpbar i,.mini i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ff9600);border-radius:9px;transition:width .4s}
.goal{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 16px;margin-bottom:12px}
.goal svg{flex:none}
.goal b{font-size:16px}.goal div{color:var(--mut);font-size:13px}
.play{width:100%;border:0;border-radius:18px;background:var(--g);box-shadow:0 5px 0 var(--gd);padding:18px;font-size:22px;font-weight:800;margin-bottom:6px}
.play small{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:2px}
.play:active,.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gd)}
.new{width:100%;border:0;border-radius:16px;background:var(--b);box-shadow:0 4px 0 #1089c4;padding:12px;font-size:16px;font-weight:700;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode{border:0;background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 4px 0 #11143a}
.mode b{display:block;font-size:16px;margin-top:4px}.mode span{font-size:30px}.mode small{color:var(--mut);font-size:12px}
.mode:active{transform:translateY(2px)}
h2{font-size:15px;color:var(--mut);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.06em}
.pack{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:16px;padding:12px;margin-bottom:8px;text-align:left}
.pack.lock{opacity:.5}
.pe{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex:none}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:15px}.pt small{color:var(--mut)}
.mini{height:7px;background:#11143a;border-radius:7px;overflow:hidden;margin-top:6px}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:14px 2px}
.link{background:none;border:0;color:var(--b);font-weight:700}
/* SESSION */
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.x{background:none;border:0;font-size:24px;color:var(--mut);padding:4px 8px}
.bar{flex:1;height:14px;background:var(--card);border-radius:9px;overflow:hidden}
.bar i{background:linear-gradient(90deg,#7be000,var(--g))}
.bar.time i{background:linear-gradient(90deg,#ff9600,var(--r))}
#stage{flex:1;overflow-y:auto;padding:6px 2px 14px;border-radius:16px}
#stage.gold{box-shadow:inset 0 0 0 2px var(--y);background:rgba(255,200,0,.05)}
.lab{font-weight:800;font-size:17px;margin:8px 0 12px}
.gb{background:var(--y);color:#3a2b00;border-radius:9px;padding:2px 8px;font-size:12px;margin-left:6px}
.prompt{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.mas{font-size:44px}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:20px;font-weight:600;flex:1;line-height:1.3}
.bubble small{display:block;color:var(--mut);font-size:14px;margin-top:6px;font-weight:500}
.sp{background:var(--card2);border:0;border-radius:14px;font-size:24px;padding:10px 16px;margin:0 6px 6px 0}
.sps{margin:2px 0 10px}
.ans{min-height:86px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;margin-bottom:14px;display:flex;flex-wrap:wrap;align-content:flex-start;background:repeating-linear-gradient(transparent 0 46px,var(--line) 46px 48px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center}
.tile{background:var(--card2);border:2px solid #4b55a0;border-bottom-width:4px;border-radius:12px;padding:9px 14px;font-size:19px;font-weight:600;margin:4px}
.tile:active{transform:translateY(2px)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:var(--card2);border:2px solid #4b55a0;border-bottom-width:4px;border-radius:14px;padding:14px;font-size:20px;font-weight:700}
.big{font-size:24px;font-weight:700;line-height:1.35;margin:6px 0}
.big u{text-decoration:none;border-bottom:3px dashed var(--y);padding:0 10px}
input.t{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;color:#fff;font-size:20px;padding:14px;outline:none}
input.t:focus{border-color:var(--b)}
.hintbtn{background:none;border:0;color:var(--y);font-weight:700;padding:10px 4px}
.hintbox{color:var(--y);font-size:18px;margin:6px 0;font-weight:600;letter-spacing:.04em}
.micwrap{text-align:center;margin-top:10px}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--b);box-shadow:0 6px 0 #1089c4;font-size:52px}
.mic.on{background:var(--r);box-shadow:0 0 0 0 rgba(255,90,90,.7);animation:pulse 1.1s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 28px rgba(255,90,90,0)}100%{box-shadow:0 0 0 0 rgba(255,90,90,0)}}
.mst{margin:12px 0 4px;color:var(--mut);font-weight:600;min-height:22px}
.heard{color:#fff;font-style:italic;min-height:22px}
.self{display:flex;gap:10px;margin-top:14px}
.self button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}
#foot{margin-top:6px}
.main{width:100%;border:0;border-radius:16px;background:var(--g);box-shadow:0 5px 0 var(--gd);padding:16px;font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.main:disabled{background:#394071;box-shadow:0 5px 0 #262c57;color:#7f88c0}
.main.red{background:var(--r);box-shadow:0 5px 0 var(--rd)}
.fb{border-radius:18px;padding:14px;animation:up .25s}
.fb.ok{background:#1f4d1a}.fb.ko{background:#5a1f26}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.fbt{font-size:21px;font-weight:800;margin-bottom:6px}
.xp{background:var(--y);color:#3a2b00;border-radius:9px;padding:2px 8px;font-size:14px;margin-left:6px}
.fbc{margin:6px 0 12px;font-size:17px;line-height:1.35}.fbn{color:var(--y);font-size:14px;margin-bottom:4px}
.learn{text-align:center;padding-top:20px}
.learn .tag{color:var(--y);font-weight:800;letter-spacing:.08em}
.learn .en{font-size:30px;font-weight:800;margin:20px 0 10px;line-height:1.25}
.learn .es{font-size:20px;color:var(--mut)}
/* SUMMARY */
.sum{text-align:center;padding-top:30px}
.sum .stars{font-size:54px}
.sum h1{margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:var(--card);border-radius:16px;padding:12px 4px}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,7,25,.8);display:grid;place-items:center;z-index:50;padding:18px}
.modal{background:var(--card);border-radius:20px;padding:18px;max-width:420px;width:100%;max-height:90dvh;overflow:auto}
.modal h3{margin:0 0 12px}.modal label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.modal input[type=text]{background:var(--bg);border:2px solid var(--line);border-radius:10px;color:#fff;padding:8px;font-size:16px;width:150px}
.modal input[type=checkbox]{width:22px;height:22px}
.modal .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal .btns button{flex:1;border:0;border-radius:12px;padding:10px;background:var(--card2);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:88vw;text-align:center}
.cf{position:fixed;top:-30px;animation:fall linear forwards;z-index:99;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div id="screen"></div></div>
<script>
/* ============ CONTENIDO: frases (no palabras sueltas) ============ */
const PACKS=[
{n:'Hola y yo',e:'👋',c:[
["How are you today?","¿Cómo estás hoy?"],
["I am fine, thank you.","Estoy bien, gracias."],
["What is your name?","¿Cómo te llamas?"],
["My name is Tom.","Me llamo Tom."],
["Nice to meet you.","Encantado de conocerte."],
["I am seven years old.","Tengo siete años."],
["Where are you from?","¿De dónde eres?"],
["I am from Spain.","Soy de España."],
["See you tomorrow!","¡Hasta mañana!"],
["Good night, sleep well.","Buenas noches, duerme bien."]]},
{n:'Mi familia',e:'👨‍👩‍👧',c:[
["This is my mother.","Esta es mi madre."],
["My father is tall.","Mi padre es alto."],
["I have a little sister.","Tengo una hermana pequeña."],
["My brother likes football.","A mi hermano le gusta el fútbol."],
["She is my grandmother.","Ella es mi abuela."],
["We live in a big house.","Vivimos en una casa grande."],
["My dog is very funny.","Mi perro es muy gracioso."],
["Do you have a brother?","¿Tienes un hermano?"],
["He is my best friend.","Él es mi mejor amigo."],
["My family is the best.","Mi familia es la mejor."]]},
{n:'Comida',e:'🍕',c:[
["I want an apple, please.","Quiero una manzana, por favor."],
["She eats bread and cheese.","Ella come pan y queso."],
["I do not like fish.","No me gusta el pescado."],
["Do you want some water?","¿Quieres un poco de agua?"],
["We drink milk for breakfast.","Bebemos leche en el desayuno."],
["The pizza is hot.","La pizza está caliente."],
["I am hungry and thirsty.","Tengo hambre y sed."],
["He eats a big sandwich.","Él come un bocadillo grande."],
["Can I have an ice cream?","¿Puedo tomar un helado?"],
["The soup is very good.","La sopa está muy buena."]]},
{n:'Animales',e:'🐶',c:[
["The cat is under the table.","El gato está debajo de la mesa."],
["I see a big bird.","Veo un pájaro grande."],
["The horse runs fast.","El caballo corre rápido."],
["Dogs like to play.","A los perros les gusta jugar."],
["The fish swims in the water.","El pez nada en el agua."],
["My rabbit is white.","Mi conejo es blanco."],
["Where is the little mouse?","¿Dónde está el ratoncito?"],
["The lion is not afraid.","El león no tiene miedo."],
["Birds can fly.","Los pájaros pueden volar."],
["I have two black cats.","Tengo dos gatos negros."]]},
{n:'En el cole',e:'🏫',c:[
["Open your book, please.","Abre tu libro, por favor."],
["I have a red pencil.","Tengo un lápiz rojo."],
["The teacher is very kind.","La profesora es muy amable."],
["We read a story today.","Hoy leemos un cuento."],
["I like maths and art.","Me gustan las matemáticas y el arte."],
["Can I go to the bathroom?","¿Puedo ir al baño?"],
["Listen and repeat.","Escucha y repite."],
["My bag is on the chair.","Mi mochila está en la silla."],
["Today we have English class.","Hoy tenemos clase de inglés."],
["I do my homework at home.","Hago mis deberes en casa."]]},
{n:'Mi día',e:'⏰',c:[
["I wake up at seven.","Me despierto a las siete."],
["I brush my teeth every day.","Me lavo los dientes todos los días."],
["She goes to school by bus.","Ella va al colegio en autobús."],
["We have lunch at two.","Comemos a las dos."],
["After school I play outside.","Después del colegio juego fuera."],
["He takes a shower at night.","Él se ducha por la noche."],
["I watch TV with my family.","Veo la tele con mi familia."],
["What time is it?","¿Qué hora es?"],
["It is time to sleep.","Es hora de dormir."],
["I go to bed early.","Me acuesto temprano."]]},
{n:'Emociones y tiempo',e:'😀',c:[
["I am happy today.","Estoy feliz hoy."],
["She is sad because it is raining.","Ella está triste porque llueve."],
["He is tired and sleepy.","Él está cansado y tiene sueño."],
["Are you afraid of the dark?","¿Tienes miedo de la oscuridad?"],
["I am very excited!","¡Estoy muy emocionado!"],
["The weather is cold today.","Hoy hace frío."],
["It is sunny and warm.","Hace sol y calor."],
["I feel good with my friends.","Me siento bien con mis amigos."],
["Do not worry, it is easy.","No te preocupes, es fácil."],
["We are proud of you.","Estamos orgullosos de ti."]]},
{n:'Ciudad y lugares',e:'🏙️',c:[
["Where is the bathroom?","¿Dónde está el baño?"],
["The park is near my house.","El parque está cerca de mi casa."],
["Turn left at the school.","Gira a la izquierda en el colegio."],
["The shop is open today.","La tienda está abierta hoy."],
["I go to the park with my dad.","Voy al parque con mi papá."],
["The bus stops here.","El autobús para aquí."],
["There is a big tree in the garden.","Hay un árbol grande en el jardín."],
["Can you help me, please?","¿Puedes ayudarme, por favor?"],
["How much is this toy?","¿Cuánto cuesta este juguete?"],
["I am lost. Where is my mom?","Estoy perdido. ¿Dónde está mi mamá?"]]},
{n:'Quiero y puedo',e:'🎮',c:[
["I can swim very well.","Puedo nadar muy bien."],
["Can you play with me?","¿Puedes jugar conmigo?"],
["I want to play a video game.","Quiero jugar a un videojuego."],
["She likes to draw animals.","A ella le gusta dibujar animales."],
["We are going to eat pizza.","Vamos a comer pizza."],
["I do not want to go.","No quiero ir."],
["He cannot find his shoes.","Él no encuentra sus zapatos."],
["Let's build a big tower!","¡Vamos a construir una torre grande!"],
["What do you like to do?","¿Qué te gusta hacer?"],
["I love my new tablet.","Me encanta mi tableta nueva."]]},
{n:'Retos',e:'🚀',c:[
["Why do you like this book?","¿Por qué te gusta este libro?"],
["Because it is very funny.","Porque es muy divertido."],
["Yesterday I played with my friends.","Ayer jugué con mis amigos."],
["Tomorrow we are going to the beach.","Mañana vamos a la playa."],
["I think the answer is correct.","Creo que la respuesta es correcta."],
["She has a bigger room than me.","Ella tiene una habitación más grande que yo."],
["Which color do you want?","¿Qué color quieres?"],
["I always drink water after sports.","Siempre bebo agua después del deporte."],
["Please, can you say it again?","Por favor, ¿puedes decirlo otra vez?"],
["I want to learn English every day.","Quiero aprender inglés todos los días."]]}
];
const CARDS=[];PACKS.forEach((p,pi)=>p.c.forEach((c,i)=>CARDS.push({id:pi*100+i,pack:pi,en:c[0],es:c[1]})));

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ds(new Date());
const yestStr=()=>ds(new Date(Date.now()-864e5));
const STOP=new Set("a an the is am are i you he she it we they to of in on at and or my your his her our do does not no yes with for this that there here be can have has want like very too so but its".split(' '));
const PROPER={tom:'Tom',spain:'Spain',english:'English','españa':'España'};
const CONT={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","that's":"that is","what's":"what is","where's":"where is","there's":"there is","don't":"do not","doesn't":"does not","can't":"cannot","isn't":"is not","aren't":"are not","let's":"let us","i'll":"i will","i'd":"i would","won't":"will not","didn't":"did not"};
const NUM="zero one two three four five six seven eight nine ten eleven twelve".split(' ');
function norm(s,es){
  s=String(s).toLowerCase().replace(/[’`´]/g,"'");
  if(es)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[^a-z0-9'\s]/g,' ').replace(/\b\d{1,2}\b/g,m=>NUM[+m]||m).replace(/\bcan not\b/g,'cannot');
  if(!es)s=s.split(/\s+/).map(w=>CONT[w]||w).join(' ');
  return s.replace(/\s+/g,' ').trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function toks(s){return s.replace(/[¿¡.,!?;:]/g,'').trim().split(/\s+/).map(w=>{const l=w.toLowerCase();if(/^i('|$)/i.test(w))return 'I'+w.slice(1).toLowerCase();return PROPER[l]||l})}
const ENW=[...new Set(CARDS.flatMap(c=>toks(c.en)))],ESW=[...new Set(CARDS.flatMap(c=>toks(c.es)))];
function distract(tokens,pool,n){const set=new Set(tokens.map(t=>t.toLowerCase()));return shuf(pool.filter(w=>!set.has(w.toLowerCase()))).slice(0,n)}
function speechScore(heard,target){const t=norm(target).split(' '),h=norm(heard).split(' ');const used=h.slice();let m=0;t.forEach(w=>{const i=used.indexOf(w);if(i>=0){m++;used.splice(i,1)}});return m/t.length}

/* ============ ESTADO ============ */
const KEY='english_quest_v1';
const def=()=>({name:'',xp:0,streak:0,last:'',day:{},cards:{},slow:false,mute:false,unlock:false,best:0});
let S=def(),storageOK=true;
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
const XPL=120,GOAL=60;
const TITLES=['Aprendiz','Explorador','Aventurero','Cazador de frases','Mago del inglés','Guardián del idioma','Capitán Fluent','Maestro Jedi','Leyenda'];
const lvl=x=>Math.floor(x/XPL)+1;
const title=l=>TITLES[Math.min(l-1,TITLES.length-1)];
const INT=[0,10,1440,4320,10080,23040,50400]; // minutos por caja (estilo Anki/Leitner)
function gradeCard(id,ok,soft){
  const c=S.cards[id]||{box:0,ok:0,ko:0};
  if(ok){c.ok++;if(!soft||c.box===0)c.box=Math.min(6,c.box+1)}else{c.ko++;c.box=Math.max(1,c.box-2)}
  c.due=Date.now()+INT[c.box]*60000;S.cards[id]=c;
}
function unlockedPacks(){
  if(S.unlock)return PACKS.map((_,i)=>i);
  const u=[0];
  for(let i=1;i<PACKS.length;i++){const cs=CARDS.filter(c=>c.pack===i-1);const ok=cs.filter(c=>(S.cards[c.id]||{box:0}).box>=1).length;if(ok>=Math.ceil(cs.length*.6))u.push(i);else break}
  return u;
}
function touchStreak(){if(S.last!==todayStr()){S.streak=(S.last===yestStr())?S.streak+1:1;S.last=todayStr()}}
const streakShown=()=>(S.last===todayStr()||S.last===yestStr())?S.streak:0;

/* ============ AUDIO / VOZ ============ */
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,slow){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.55:(S.slow?0.72:0.9);speechSynthesis.speak(u)}catch(e){}}
let AC;
function tone(seq){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const sOk=()=>tone([[660,.1],[880,.16]]),sKo=()=>tone([[240,.28]]),sWin=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.32]]);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function buildSession(mode,opts){
  opts=opts||{};
  const now=Date.now(),up=unlockedPacks();
  const pool=CARDS.filter(c=>up.includes(c.pack)&&(opts.pack==null||c.pack===opts.pack));
  const st=c=>S.cards[c.id];
  if(mode==='relampago'){const base=pool.filter(c=>st(c));return (base.length>=4?base:pool).filter(c=>c.en.split(' ').length<=7)}
  const due=pool.filter(c=>st(c)&&st(c).due<=now).sort((a,b)=>st(a).due-st(b).due);
  const fresh=pool.filter(c=>!st(c));
  let items=[];
  if(opts.onlyNew){fresh.slice(0,6).forEach(c=>items.push({c,isNew:true}))}
  else{
    due.slice(0,10).forEach(c=>items.push({c}));
    fresh.slice(0,items.length>=10?2:5).forEach(c=>items.push({c,isNew:true}));
    if(items.length<8){shuf(pool.filter(c=>st(c)&&!due.includes(c))).slice(0,8-items.length).forEach(c=>items.push({c,p:true}))}
  }
  const nw=items.filter(i=>i.isNew),rest=shuf(items.filter(i=>!i.isNew));
  return nw.length?shuf(rest.concat(nw)):rest;
}
function go(mode,opts){
  if(mode==='hablar'&&!SR){toast('Para hablar abre el archivo con Chrome: aquí no hay micro');return}
  const items=buildSession(mode,opts);
  if(!items.length){toast(mode==='nuevas'?'No hay más frases nuevas por ahora. ¡Sube de nivel!':'Aún no hay frases. Pulsa «Aprender frases nuevas»');return}
  const timed=mode==='relampago';
  P={mode,queue:timed?[]:items,src:timed?items:null,done:0,total:items.length,xp:0,combo:0,maxCombo:0,ok:0,ko:0,timed,lv0:lvl(S.xp),lastType:null,locked:false};
  $('#screen').innerHTML=`<div class="top"><button class="x" data-a="quit">✕</button><div class="bar ${timed?'time':''}"><i id="pb" style="width:${timed?100:0}%"></i></div><div class="chip" id="cmb">${timed?'60':'0 XP'}</div></div><div id="stage"></div><div id="foot"></div>`;
  if(timed){P.tEnd=Date.now()+60000;timer=setInterval(()=>{const left=Math.max(0,P.tEnd-Date.now());$('#pb').style.width=(left/600)+'%';$('#cmb').textContent=Math.ceil(left/1000)+'s';if(left<=0)finish()},250)}
  next();
}
function quit(){home()}
function updChips(){const p=$('#pb'),c=$('#cmb');if(!p)return;if(!P.timed){p.style.width=(P.done/P.total*100)+'%';c.textContent=(P.combo>=2?'🔥x'+P.combo+' ':'')+P.xp+' XP'}}
function next(){
  if(P.timed){if(!P.queue.length)P.queue=shuf(P.src).map(c=>({c}))}
  else if(!P.queue.length)return finish();

  renderEx();
}

function pickType(){
  const c=P.cur.c,box=(S.cards[c.id]||{box:0}).box,m=P.mode;
  if(P.cur.first)return (m==='hablar'&&SR)?'echo':'buildES';
  if(P.cur.retry)return 'buildEN';
  let L;
  if(m==='hablar')L=box<=1?['echo']:box>=3?['speakEN']:['speakEN','echo'];
  else if(m==='escribir')L=box<=0?['buildEN']:box===1?['buildEN','dictado']:['writeEN','dictado'];
  else if(m==='construir')L=['buildEN','buildES','listen','cloze'];
  else if(m==='relampago')L=['buildEN','buildES','cloze'];
  else L=box<=0?['buildES','echo']:box===1?['buildEN','listen','cloze','echo']:box===2?['writeEN','buildES','speakEN','cloze']:['writeEN','speakEN','dictado','buildES','listen'];
  if(!SR)L=L.filter(x=>x!=='echo'&&x!=='speakEN');if(!L.length)L=['buildEN','writeEN'];const f=L.filter(x=>x!==P.lastType);return rnd(f.length?f:L);
}
const LAB={buildEN:'Traduce al inglés 🇬🇧',buildES:'Traduce al español 🇪🇸',listen:'Escucha y construye en español',cloze:'Completa la frase',writeEN:'Escríbelo en inglés ✍️',dictado:'Dictado: escribe lo que oyes',echo:'Escucha y repite 🎤',speakEN:'Dilo en inglés 🎤'};

    const pk=cand.length?rnd(cand):{w:parts[parts.length-1].replace(/[.,!?]/g,''),i:parts.length-1};
    const word=pk.w.toLowerCase();

    st.innerHTML=h+`<div class="big">${show}</div><div class="opts">${opts.map(o=>`<button class="opt" data-w="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(P.locked)return;say(b.dataset.w);b.dataset.w===word?answer(true,{}):answer(false,{})})}

function mountTiles(tokens,dis,auto,sayTiles){
  let bank=shuf([...tokens,...dis].map((w,i)=>({w,id:i}))),ans=[];
  $('#stage').insertAdjacentHTML('beforeend','<div class="ans" id="ans"></div><div class="bank" id="bank"></div>');
  const draw=()=>{
    $('#ans').innerHTML=ans.map(t=>`<button class="tile" data-i="${t.id}">${esc(t.w)}</button>`).join('');
    $('#bank').innerHTML=bank.map(t=>`<button class="tile" data-i="${t.id}">${esc(t.w)}</button>`).join('');
    const g=$('#go');if(g)g.disabled=!ans.length;
  };
  $('#bank').onclick=e=>{const b=e.target.closest('.tile');if(!b||P.locked)return;const i=bank.findIndex(t=>t.id==b.dataset.i);if(i<0)return;const t=bank.splice(i,1)[0];ans.push(t);if(sayTiles)say(t.w);draw();if(auto&&ans.length===tokens.length)setTimeout(()=>P.onGo&&!P.locked&&P.onGo(),150)};
  $('#ans').onclick=e=>{const b=e.target.closest('.tile');if(!b||P.locked)return;const i=ans.findIndex(t=>t.id==b.dataset.i);if(i<0)return;bank.push(ans.splice(i,1)[0]);draw()};
  draw();P.get=()=>ans.map(t=>t.w);
}
function setupMic(target){
  const mic=$('#mic'),mst=$('#mst'),hd=$('#heard');
  if(!SR){mst.textContent='Este navegador no tiene reconocimiento de voz.';return}
  let rec=null;
  mic.onclick=()=>{
    if(P.locked)return;
    if(rec){try{rec.stop()}catch(e){}return}
    try{speechSynthesis.cancel()}catch(e){}
    rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
    let got=false;
    rec.onstart=()=>{mic.classList.add('on');mst.textContent='Te escucho…';hd.textContent=''};
    rec.onresult=e=>{
      got=true;const alts=[...e.results[0]].map(a=>a.transcript);
      const sc=Math.max(...alts.map(a=>speechScore(a,target)));
      hd.textContent='Escuché: “'+alts[0]+'”';P.tries++;
      if(sc>=0.8)answer(true,{speak:true});
      else if(P.tries>=2)answer(false,{speak:true});
      else mst.textContent='¡Casi! Inténtalo otra vez 💪 (toca el micro)';
    };
    rec.onerror=e=>{
      got=true;
      if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='network'||e.error==='audio-capture'){mst.textContent=e.error==='network'?'Sin conexión: el reconocimiento de voz necesita internet.':'El micro no tiene permiso. Actívalo en Chrome (icono del candado) y recarga.'}
      else if(e.error==='no-speech')mst.textContent='No te oigo. Acércate y habla más fuerte.';
      else if(e.error!=='aborted')mst.textContent='Algo falló, prueba otra vez.';
    };
    rec.onend=()=>{mic.classList.remove('on');rec=null;if(!got&&!P.locked)mst.textContent='No te he oído. Toca el micro otra vez.'};
    try{rec.start()}catch(e){rec=null}
  };
}
function answer(ok,o){
  if(P.locked)return;P.locked=true;o=o||{};
  const c=P.cur.c,first=!P.cur.retry;let gain=0;
  if(ok){
    P.combo++;P.maxCombo=Math.max(P.maxCombo,P.combo);
    gain=(P.hint?5:10)+(o.speak?5:0)+(P.combo>=5?10:P.combo>=3?5:0);
    if(P.gold)gain*=2;
    if(P.cur.retry||P.cur.p)gain=Math.ceil(gain/2);
  }else P.combo=0;
  if(first&&!P.cur.p&&!P.timed)gradeCard(c.id,ok,!!(o.soft||P.hint));
  if(first){ok?P.ok++:P.ko++}
  if(!ok&&first&&!P.timed&&!P.cur.p)P.queue.splice(Math.min(3,P.queue.length),0,{c,retry:true});
  if(gain){S.xp+=gain;S.day[todayStr()]=(S.day[todayStr()]||0)+gain;P.xp+=gain}
  touchStreak();save();
  const L=lvl(S.xp);
  ok?sOk():sKo();
  try{if(navigator.vibrate)navigator.vibrate(ok?25:[40,40,40])}catch(e){}
  if(ok&&(P.combo===5||P.combo===10))confetti(18);
  const esT=(P.type==='buildES'||P.type==='listen');
  const txt=esT?c.es:c.en;
  $('#foot').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><div class="fbt">${ok?rnd(['¡Genial!','¡Perfecto!','¡Eso es!','¡Crack!','¡Bien hecho!']):(o.skip?'Esta es la respuesta 👀':rnd(['Casi…','Uy, casi','No pasa nada']))}${gain?'<span class="xp">+'+gain+' XP</span>':''}</div>${o.note?'<div class="fbn">'+o.note+'</div>':''}<div class="fbc">${ok?'<b>'+esc(c.en)+'</b><br>'+esc(c.es):'Correcto:<br><b>'+esc(txt)+'</b>'+(esT?'':'<br>'+esc(c.es))}</div><button class="main ${ok?'':'red'}" id="nx">Continuar</button></div>`;
  $('#nx').onclick=cont;
  updChips();
  if(!(ok&&o.speak))setTimeout(()=>say(c.en),300);

function cont(){

}
function finish(){

  if(P.timed&&P.ok>S.best){S.best=P.ok;rec='<p style="color:var(--y);font-weight:800">🏆 ¡Nuevo récord!</p>'}

  $('#screen').innerHTML=`<div class="sum"><div class="stars">${stars}</div><h1>${P.timed?'¡Tiempo!':'¡Sesión completada!'}</h1>${rec}${up?`<p style="font-size:18px;font-weight:800;color:var(--y)">🎖️ ¡Subes al nivel ${L}: ${title(L)}!</p>`:''}
  <div class="stats"><div class="stat"><b>+${P.xp}</b><small>XP</small></div><div class="stat"><b>${acc}%</b><small>aciertos</small></div><div class="stat"><b>${P.maxCombo}</b><small>mejor racha</small></div></div>
  ${P.timed?`<p style="color:var(--mut)">Aciertos: ${P.ok} · Récord: ${S.best}</p>`:''}
  <button class="play" data-a="again">Otra ronda</button><div style="height:10px"></div><button class="new" style="background:var(--card2);box-shadow:0 4px 0 #11143a" data-a="home">Inicio</button></div>`;
}

function settings(){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="modal"><h3>⚙️ Ajustes</h3>
  <label>Nombre<input type="text" id="sn" value="${esc(S.name)}"></label>
  <label>Voz inglesa más lenta<input type="checkbox" id="ss" ${S.slow?'checked':''}></label>
  <label>Sonidos<input type="checkbox" id="sm" ${S.mute?'':'checked'}></label>
  <label>Desbloquear todos los niveles<input type="checkbox" id="su" ${S.unlock?'checked':''}></label>
  <textarea id="box" style="width:100%;height:70px;display:none;margin-top:10px;background:var(--bg);color:#fff;border:2px solid var(--line);border-radius:10px"></textarea>
  <div class="btns"><button id="ex">Copiar progreso</button><button id="im">Pegar progreso</button><button id="rs" style="background:#5a1f26">Borrar todo</button></div>
  <div class="btns"><button id="ok" style="background:var(--g)">Guardar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#ex').onclick=()=>{const j=JSON.stringify(S),t=d.querySelector('#box');t.style.display='block';t.value=j;t.select();try{navigator.clipboard&&navigator.clipboard.writeText(j).then(()=>toast('Progreso copiado'),()=>{})}catch(e){}};
  d.querySelector('#im').onclick=()=>{const t=d.querySelector('#box');if(t.style.display==='none'||!t.value.trim()){t.style.display='block';t.value='';t.placeholder='Pega aquí el progreso y vuelve a pulsar «Pegar progreso»';return}try{S=Object.assign(def(),JSON.parse(t.value));save();d.remove();home();toast('Progreso cargado')}catch(e){toast('Texto no válido')}};
  d.querySelector('#rs').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent='¿Seguro? Toca otra vez';return}S=def();save();d.remove();askName()};
  d.querySelector('#ok').onclick=()=>{S.name=d.querySelector('#sn').value.trim();S.slow=d.querySelector('#ss').checked;S.mute=!d.querySelector('#sm').checked;S.unlock=d.querySelector('#su').checked;save();d.remove();home()};
}
function askName(){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="modal" style="text-align:center"><div style="font-size:60px">🦊</div><h3>¡Bienvenido a English Quest!</h3><p style="color:var(--mut)">¿Cómo te llamas, aventurero?</p><input type="text" id="nm" style="width:100%;font-size:20px;text-align:center"><div class="btns"><button id="go2" style="background:var(--g);font-size:18px">¡Vamos!</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#go2').onclick=()=>{S.name=d.querySelector('#nm').value.trim();save();d.remove();home()};
  home();
}
const ACT={go:(m,o)=>go(m,o==='new'?{onlyNew:true}:undefined),pack:i=>packGo(+i),settings:()=>settings(),quit:()=>quit(),home:()=>home(),say:()=>{if(P&&P.cur)say(P.cur.c.en)},slow:()=>{if(P&&P.cur)say(P.cur.c.en,true)},again:()=>go(P.mode==='nuevas'?'mixto':P.mode)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a.split('|'),f=ACT[a[0]];if(f)f(a[1],a[2])});
if(!S.name)askName();else home();
</script>
</body>
</html>
